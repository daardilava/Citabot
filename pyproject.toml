[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citabot"
version = "0.1.0"
description = "Agente de citas y preguntas frecuentes por WhatsApp para pymes (MVP)"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["ruff==0.17.5", "mypy==2.4.1", "pre-commit"]
llm = ["anthropic"]  # only needed with NLU_PROVIDER=llm

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Spanish text uses «», – and accents on purpose

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["citabot"]

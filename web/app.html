<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citabot · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="booting">
    <a class="skip-link" href="#view">Saltar al contenido</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/app#/resumen">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5" /></svg>
          </span>
          <span class="brand-name">Citabot</span>
        </a>
        <p class="business-name" id="business-name">&nbsp;</p>

        <nav class="nav" aria-label="Secciones">
          <a href="#/resumen" data-route="resumen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z" /></svg>
            Resumen
          </a>
          <a href="#/conversaciones" data-route="conversaciones">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z" /></svg>
            Conversaciones
            <span class="nav-badge" id="attention-badge" hidden></span>
          </a>
          <a href="#/agenda" data-route="agenda">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v14H5zM5 10h14M9 3v4M15 3v4" /></svg>
            Agenda
          </a>
          <a href="#/conocimiento" data-route="conocimiento">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5zM14 4v5h5M9 13h6M9 17h6" /></svg>
            Conocimiento
          </a>
          <a href="#/configuracion" data-route="configuracion">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4" /></svg>
            Configuración
          </a>
        </nav>

        <a class="sim-link" href="#/simulador" data-route="simulador">
          <span class="sim-dot" aria-hidden="true"></span>
          <span>
            <strong>Simulador de WhatsApp</strong>
            <small>Escribe como si fueras un cliente</small>
          </span>
        </a>

        <div class="account">
          <span class="avatar avatar-dark" id="account-initials" aria-hidden="true"></span>
          <span class="account-text">
            <strong id="account-name">&nbsp;</strong>
            <small id="account-email">&nbsp;</small>
          </span>
          <button class="account-out" id="logout" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M15 8l4 4-4 4M19 12H9" /></svg>
          </button>
        </div>
      </aside>

      <main class="main" id="view" tabindex="-1"></main>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
